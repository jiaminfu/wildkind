# ============================================================
# TIDEGLASS · Nginx 站点配置（无域名 / IP 访问版）
#
# 适用：还没有域名，且服务器上已经跑着别的项目
#
# 设计原则：一个字都不碰已有的 80 / 443。
#   · 只听 8080（可用 LISTEN_PORT 改），不抢 80 的默认站点
#   · server_name 用 _，只在「访问这个端口」时才命中，不影响任何已有 Host
#   · 不写 default_server，不会把别人的流量截走
#
# 放置：
#   sudo sed -e 's/__LISTEN_PORT__/8080/g' -e 's/__APP_PORT__/4600/g' \
#        deploy/nginx-tideglass-port.conf \
#     | sudo tee /etc/nginx/sites-available/tideglass.conf
#   sudo ln -sf /etc/nginx/sites-available/tideglass.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 想只允许自己访问（强烈建议，HTTP 下后台口令是明文）：
#   取消下面 allow / deny 两行的注释，改成你的公网 IP
# ============================================================

server {
    listen __LISTEN_PORT__;
    # 服务器确认支持 IPv6 再打开下面这行，否则 reload 会报
    # "socket() [::]:8080 failed (97: Address family not supported)"
    # listen [::]:__LISTEN_PORT__;
    server_name _;

    # ---- 来源限制（可选，强烈建议）----
    # allow 1.2.3.4;      # ← 换成你本机的公网 IP：curl ifconfig.me
    # deny  all;

    client_max_body_size 256k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 刻意不发 Strict-Transport-Security：当前是 HTTP，
    # 发了 HSTS 会让浏览器以后强制走 https，等真上证书时反而多点麻烦

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/tideglass.access.log;
    error_log  /var/log/nginx/tideglass.error.log warn;

    root /opt/tideglass/current/app/web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(git|env|ht) {
        deny all;
        return 404;
    }
}

# ============================================================
# 以后有了域名怎么切（不用重装，改一处即可）
#
#   1. DNS 加 A 记录指向本机
#   2. 把本文件里的 listen 端口改成 80，server_name 改成域名
#      （若 80 已被别的项目占用，就继续用 8080，只给它加一个 server_name）
#   3. sudo certbot --nginx -d 你的域名 -m 邮箱 --agree-tos --redirect
#   4. 前台/后台的地址从 http://IP:8080 换成 https://域名
#   5. 关掉 8080 的公网放行
# ============================================================
