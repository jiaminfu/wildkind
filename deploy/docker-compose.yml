# ============================================================
# TIDEGLASS · Docker Compose 生产编排
# 用法：
#   cd deploy
#   cp .env.example .env && nano .env        # 改掉所有 CHANGE_ME
#   docker compose up -d --build
#   docker compose logs -f
#
# 端口绑在哪里由 .env 决定，默认只绑 127.0.0.1:4600（配宿主机 Nginx + HTTPS 用）。
#
# 服务器上已经有别的项目（尤其 80/443 牵着 Docker 容器）时，别让宿主 Nginx 上，
# 直接用独立端口对外：
#   在 .env 里写
#     BIND_ADDR=0.0.0.0
#     HOST_PORT=8080
#   然后 docker compose up -d --build
#   访问 http://<公网IP>:8080/
#
# 与已有项目的隔离点：本文件有独立的 name / 卷 / 网络 / 容器名，
# 和别的 compose 项目除了宿主机端口之外没有任何共享——端口不撞就互不影响。
# ============================================================
name: tideglass

services:
  tideglass:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tideglass:1.0.0
    container_name: tideglass
    restart: unless-stopped

    env_file:
      - .env

    ports:
      # BIND_ADDR 默认 127.0.0.1：只给本机反代用，公网摸不到。
      # 无域名/共存场景改成 0.0.0.0 并把 HOST_PORT 换成一个空闲端口。
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-4600}:4600"

    # 数据必须落在卷里。容器重建很频繁，卷不重建。
    volumes:
      - tideglass-data:/app/app/server/data

    # 单实例：JSON 存储 + 内存限流 + 内存会话，replicas 只能是 1
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4600/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  tideglass-data:
    name: tideglass-data
