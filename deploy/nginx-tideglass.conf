# ============================================================
# TIDEGLASS · Nginx 站点配置
#
# 放置：/etc/nginx/sites-available/tideglass.conf（软链到 sites-enabled）
# 把 __DOMAIN__ 换成你的域名：
#   sudo sed -i 's/__DOMAIN__/shop.example.com/g' /etc/nginx/sites-available/tideglass.conf
#
# 这份配置刻意只写「一个 server 块、只听 80」：
#   HTTPS 交给 certbot 在原地改——它会给这个块补上 listen 443 ssl 与证书路径，
#   再另建一个 80→443 的跳转块。这样证书还没签的时候 nginx -t 也是通的，
#   不会出现「配置里写了不存在的证书路径，服务起不来」这种自锁局面。
#
# 设计取舍：
#   · 静态文件由 Nginx 直接出，只有 /api/ 转给 Node——图片和 JS 不占进程
#   · 前台是 hash 路由（#/admin），所有路径都落到 index.html，无需 history 兜底规则
#   · 限流按 IP 计数，X-Forwarded-For 必须透传，否则全站共用一个令牌桶
# ============================================================

server {
    listen 80;
    # 服务器确认支持 IPv6 再打开；禁用了 IPv6 的机器上这行会让 reload 失败
    # listen [::]:80;
    server_name __DOMAIN__;

    # certbot 用 webroot 校验，必须先放行
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ---- 请求体上限：与 app/server/lib/http.js 的 MAX_BODY(256KB) 对齐 ----
    # 调大这里不会让接口收更大的包，只会在进程内被 413 拒掉；两边要一起改。
    client_max_body_size 256k;

    # ---- 基础安全头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # ---- 压缩 ----
    # 图片是 PNG/WebP，已经压过，再 gzip 是白烧 CPU，所以不给它加类型
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/tideglass.access.log;
    error_log  /var/log/nginx/tideglass.error.log warn;

    # ---- 静态站（前台 SPA + 后台同源）----
    root /opt/tideglass/current/app/web;
    index index.html;

    # ---- API 反代 ----
    location /api/ {
        proxy_pass http://127.0.0.1:4600;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # 接口响应都是小 JSON 且带 no-store，关掉缓冲让错误码立刻回传
        proxy_buffering off;
    }

    # ---- SPA 兜底 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，否则发版后用户还在跑旧 JS
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 图片/字体长缓存
    location ~* \.(png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # 别让扫描器顺着 .git / .env 摸到源码
    location ~ /\.(git|env|ht) {
        deny all;
        return 404;
    }
}

# ============================================================
# HTTPS 怎么加（不要手写 443 段，交给 certbot）
#
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d 你的域名 -m 你的邮箱 --agree-tos --redirect
#
# 跑完 certbot 会把上面这个 server 块改成：
#   listen 443 ssl; # managed by Certbot
#   ssl_certificate     /etc/letsencrypt/live/域名/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/域名/privkey.pem;
# 并自动维护续期（/etc/cron.d/certbot + systemd timer），无需手工操作。
#
# 想要 HTTP/2：证书就绪后把
#   listen 443 ssl; # managed by Certbot
# 改成
#   listen 443 ssl; http2 on;
# 再 sudo nginx -t && sudo systemctl reload nginx
#
# 前台要接 Stripe.js 等外部脚本时，在此追加 Content-Security-Policy，
# 白名单至少含 https://js.stripe.com。
# ============================================================
