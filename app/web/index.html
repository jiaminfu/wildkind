<!-- 字体自托管（原因见 app.css 顶部的 @font-face 注释）。
     只预载真正决定首屏字形的那两个：Figtree 撑正文与全部控件，
     Instrument Serif 是首屏大标题。Italiana 只用于字标，交给正常加载 ——
     三个一起预载会和 CSS/JS 抢同一条连接。 -->
<link rel="preload" href="/assets/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
<!-- 首屏大图。这个站的首页是客户端渲染，图片标签要等 JS 跑完才进 DOM ——
     实测它 2.1 秒才开始下载，直接决定 LCP。这里按 <picture> 里同一套
     srcset/sizes 提前声明，浏览器在解析 HTML 时就开始下载，且能与之去重
     （URL 解析结果一致，不会下两遍）。/journal 那边会剥掉这一行（见 headStatic）。 -->
<link rel="preload" as="image" fetchpriority="high" data-home-hero
      href="/assets/img/opt/hero-necklaces-1100.webp"
      imagesrcset="/assets/img/opt/hero-necklaces-700.webp 700w, /assets/img/opt/hero-necklaces-1100.webp 1100w"
      imagesizes="100vw">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/refine.css">
<link rel="stylesheet" href="assets/css/web.css">
<script>
  // 前后端分离：前端默认同源访问 /api/v1；分域部署时在 window.TG_API_BASE 里改
  window.TG_API_BASE = window.TG_API_BASE || '/api/v1';
</script>
<script>
  /* 首屏数据的预取。
     这个站是 hash 路由 + 客户端渲染：页面骨架要等 11 个 JS 文件下完才跑，
     跑起来才开始请求 /bootstrap。实测 Fast 3G + 4x CPU 下，第一个 API 请求
     到 1.4 秒才发出，LCP 直接被推到 2.4 秒。
     这段内联脚本在解析 HTML 时就发出同一个请求，把整条等待从关键路径上摘掉；
     app.js 的 bootLoad() 会认领这个 Promise（window.__LG_BOOT），不重复取。
     只在落地页是首页时预取 —— 深层链接（广告直接投商品页）用不上 home 数据，
     白跑 19KB 反而是负优化。 */
  (function () {
    /* 必须同时看 pathname：/journal/x 这类预渲染页的 hash 也是空的，
       只看 hash 会把首页数据预取到博客页上，白跑 19KB。 */
    var p = location.pathname;
    if (p !== '/' && p !== '/index.html') return;
    var h = (location.hash || '').replace(/^#/, '');
    if (h !== '' && h !== '/') return;
    try {
      window.__LG_BOOT = fetch((window.TG_API_BASE || '/api/v1') + '/bootstrap?with=home', {
        credentials: 'same-origin', headers: { Accept: 'application/json' }
      }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    } catch (e) { /* 老浏览器没有 fetch 时退回 app.js 里的正常请求 */ }
  })();
</script>
<!--LG_ASSETS-->
</head>
<body>
<div id="app">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;color:#1B3A34">
    Loading…
  </div>
</div>

<script src="assets/js/ui.js"></script>

<!-- admin.js 与 blog-admin.js 不在这里加载。
     79 KB 的后台代码被每一个买家先下载一遍，而他们永远不会打开后台。
     版本号由服务端注入到上面的 window.LG_ASSETS，避免按需加载时绕过 `?v=`
     拿到浏览器里的旧副本。 -->
<script src="assets/js/app.js"></script>
</body>
