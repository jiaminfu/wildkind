<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Lastgrove">
  <title>Lastgrove — three logo directions</title><desc>Direction A is recommended</desc>
  <rect width="900" height="360" fill="#FFFFFF"/>
  
  <g transform="translate(0 0)">
    <rect x="0" y="0" width="280" height="330" rx="14" fill="#EDF1F0"/>
    <rect x="0" y="0" width="280" height="4" rx="2" fill="#A85F4B"/>
    <g transform="translate(80 34) scale(1)">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 66.68 12.47 A 48 48 0 1 1 53.32 12.47" stroke="#4A7C6F" stroke-width="5"/>
    <path d="M 60 103 V 64 M 60 82 L 48 68 M 60 82 L 72 68" stroke="#4A7C6F" stroke-width="5"/>
  </g>
  <circle cx="60" cy="12.47" r="4.5" fill="#A85F4B"/></g>
    <text x="140" y="196" text-anchor="middle" fill="#1B2B2E"
      font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">A · THE PENDANT</text>
    <text x="140" y="224" text-anchor="middle" fill="#5B6B6C"
      font-family="Inter, Arial, sans-serif" font-size="12.5">ring + tree + clasp</text>
    <text x="140" y="262" text-anchor="middle" fill="#A85F4B"
      font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4">RECOMMENDED</text>
  </g>
   
  <g transform="translate(310 0)">
    <rect x="0" y="0" width="280" height="330" rx="14" fill="#EDF1F0"/>
    
    <g transform="translate(80 34) scale(1)"><g fill="none" stroke="#4A7C6F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="30" cy="48" r="12"/><circle cx="60" cy="40" r="15"/><circle cx="90" cy="48" r="12"/>
    <path d="M30 60 V90 M60 55 V90 M90 60 V90"/>
    <path d="M10 93 H110"/>
  </g></g>
    <text x="140" y="196" text-anchor="middle" fill="#1B2B2E"
      font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">B · THE GROVE</text>
    <text x="140" y="224" text-anchor="middle" fill="#5B6B6C"
      font-family="Inter, Arial, sans-serif" font-size="12.5">three trees + horizon</text>
    
  </g>
   
  <g transform="translate(620 0)">
    <rect x="0" y="0" width="280" height="330" rx="14" fill="#EDF1F0"/>
    
    <g transform="translate(80 34) scale(1)"><g fill="none" stroke="#4A7C6F" stroke-linecap="round">
    <circle cx="60" cy="60" r="44" stroke-width="5"/>
    <circle cx="60" cy="60" r="30" stroke-width="4"/>
    <circle cx="60" cy="60" r="16" stroke-width="3"/>
  </g>
  <circle cx="60" cy="16" r="4.5" fill="#A85F4B"/></g>
    <text x="140" y="196" text-anchor="middle" fill="#1B2B2E"
      font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">C · THE RINGS</text>
    <text x="140" y="224" text-anchor="middle" fill="#5B6B6C"
      font-family="Inter, Arial, sans-serif" font-size="12.5">growth rings</text>
    
  </g>
</svg>
